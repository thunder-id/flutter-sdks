appId: dev.thunderid.Quickstart
name: Change password from the profile screen
tags:
  - account
env:
  E2E_USERNAME: e2e_mobile_user
  E2E_PASSWORD: TestPassword@123
  # This flow actually changes E2E_PASSWORD on the shared E2E user via the real backend, so it
  # changes to this value and back to E2E_PASSWORD before finishing. The change revokes the app's
  # token, so it signs in again with this value before changing back. If this flow fails between
  # those two steps, the E2E user is left on this password until it is reset.
  E2E_TEMP_PASSWORD: TempPassword@456
---
- launchApp:
    clearState: true
- runFlow: subflows/ensure-signed-out.yaml

- runFlow: subflows/sign-in.yaml

- tapOn: "Manage Account"
- extendedWaitUntil:
    visible: "Security"
    timeout: 20000
- tapOn: "Security"

# The ChangeCredential row's own tap target is targeted by id, not by the "Password" label or
# "Edit" link text: every profile field row (and the credential row) renders an identical "Edit"
# link, so text would be ambiguous between them.
- extendedWaitUntil:
    visible:
      id: "thunderid-action-openCredential-password"
    timeout: 20000
- tapOn:
    id: "thunderid-action-openCredential-password"

# Change away from E2E_PASSWORD, then back, so the E2E user's credential is unchanged once this
# flow finishes, matching signin.yaml's "leaves the app as it found it" convention.
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_PASSWORD}
      NEW_PASSWORD: ${E2E_TEMP_PASSWORD}

# The change revoked the app's token. Signing in with the new value also proves it took effect.
# Back out through the section screen, then the manage account hub, to the home tab. Both back
# controls are chevron-only (no label), so they're targeted by id rather than text - see
# _BackChevron in the sample for why one shared id is unambiguous here.
- tapOn:
    id: "thunderid-nav-back"
- tapOn:
    id: "thunderid-nav-back"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
- runFlow:
    file: subflows/sign-in.yaml
    env:
      E2E_PASSWORD: ${E2E_TEMP_PASSWORD}
- tapOn: "Manage Account"
- extendedWaitUntil:
    visible: "Security"
    timeout: 20000
- tapOn: "Security"
- extendedWaitUntil:
    visible:
      id: "thunderid-action-openCredential-password"
    timeout: 20000
- tapOn:
    id: "thunderid-action-openCredential-password"
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_TEMP_PASSWORD}
      NEW_PASSWORD: ${E2E_PASSWORD}

# Back out through the section screen, then the manage account hub, to the home tab. Both back
# controls are chevron-only (no label), so they're targeted by id rather than text - see
# _BackChevron in the sample for why one shared id is unambiguous here.
- tapOn:
    id: "thunderid-nav-back"
- tapOn:
    id: "thunderid-nav-back"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
