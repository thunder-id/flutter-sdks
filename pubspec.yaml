name: thunderid_flutter
description: Flutter SDK for ThunderID identity management. Bridges to native iOS and Android SDKs via platform channels.
version: 0.0.1
homepage: https://thunderid.dev
repository: https://github.com/thunder-id/flutter-sdks
issue_tracker: https://github.com/thunder-id/flutter-sdks/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  url_launcher: ^6.2.5

dev_dependencies:
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  plugin:
    platforms:
      android:
        package: dev.thunderid.flutter
        pluginClass: ThunderIDFlutterPlugin
      ios:
        pluginClass: ThunderIDFlutterPlugin
  assets:
    - assets/logo-icons/anonymous/
    - assets/logo-icons/entity/
