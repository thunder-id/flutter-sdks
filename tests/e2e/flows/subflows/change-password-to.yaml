appId: dev.thunderid.Quickstart
---
# Fills and submits the full-screen ChangeCredential form, then waits for a successful submit to
# pop it back to the profile screen's credential row.
- extendedWaitUntil:
    visible:
      id: "thunderid-field-newCredential"
    timeout: 20000

# See signin.yaml's equivalent comment: a field can be on screen before the page's own transition
# (a fade, here) has actually finished settling, and typing into it mid-settle has been observed
# to bind an empty string.
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "thunderid-field-newCredential"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "thunderid-field-confirmCredential"
- inputText: ${NEW_PASSWORD}

- tapOn:
    id: "thunderid-action-submitCredential"

# Submitting two password fields can make iOS offer to save the new password, and that alert sits
# over the app and swallows the assertion below, as it does after sign-in. The iOS SDK's suite
# dismisses it at the same point.
- runFlow: dismiss-save-password.yaml

# A successful submission pops the full-screen form back to the profile screen, so the field
# goes away rather than a new element appearing - that is what confirms the change went through.
# The server hashes the new password before it answers, which has taken over 30 seconds on a
# loaded CI runner, so allow well beyond that.
#
# A dropped connection (NSURLErrorDomain -1005) on a loaded CI runner fails the submission and
# leaves the form open with an error and both fields still filled. Submitting the same password
# again is safe even if the first request did reach the server, so tap Save again rather than
# fail.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*error occurred while updating your password.*"
          commands:
            - tapOn:
                id: "thunderid-action-submitCredential"
            - runFlow: dismiss-save-password.yaml
      - extendedWaitUntil:
          notVisible:
            id: "thunderid-field-newCredential"
          timeout: 60000
