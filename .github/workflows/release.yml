# Entrypoint workflow for releasing the Flutter SDK.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"

jobs:
  validate:
    name: ✅ Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

  release:
    name: 🤖 Release flutter
    needs: [validate]
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          fetch-depth: 0

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 📦 Get Sample Dependencies
        working-directory: samples/quickstart
        run: flutter pub get

      - name: 🔐 Create Sample .env
        working-directory: samples/quickstart
        run: cp .env.example .env

      - name: 🔍 Run Flutter Analyze
        run: flutter analyze

      - name: 🧪 Run Tests
        run: flutter test

      - name: 🏷️ Bump Version
        id: bump
        run: |
          current=$(grep -m1 '^version: ' pubspec.yaml | sed -E 's/version: (.*)/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ github.event.inputs.bump_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          sed -i "s/^version: $current/version: $new_version/" pubspec.yaml
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: 📝 Update CHANGELOG
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            echo "## ${{ steps.bump.outputs.version }}"
            echo
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag"..HEAD --no-merges --pretty=format:"- %s"
            else
              git log --no-merges --pretty=format:"- %s"
            fi
            echo
            echo
            [ -f CHANGELOG.md ] && cat CHANGELOG.md
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: 📤 Commit, Tag & Push
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          git add pubspec.yaml CHANGELOG.md
          git diff --cached --quiet || git commit -m "[Release] flutter v${{ steps.bump.outputs.version }}"
          for i in $(seq 1 5); do
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$i" -eq 5 ] && exit 1
            sleep $((i * 3))
          done
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "ThunderID Flutter SDK v${VERSION}" \
            --generate-notes
