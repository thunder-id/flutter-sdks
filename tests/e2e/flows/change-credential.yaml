appId: dev.thunderid.Quickstart
name: Change password from the profile screen
tags:
  - account
env:
  E2E_USERNAME: e2e_mobile_user
  E2E_PASSWORD: TestPassword@123
  # This flow changes E2E_PASSWORD on the shared E2E user via the real backend: to this value, then
  # back to E2E_PASSWORD, each time giving the password the user holds as the current value. If
  # this flow fails between those two changes, the E2E user is left on this password until the
  # server is provisioned again.
  E2E_TEMP_PASSWORD: TempPassword@456
---
- launchApp:
    clearState: true
- runFlow: subflows/ensure-signed-out.yaml
- runFlow:
    file: subflows/sign-in-with.yaml
    env:
      USERNAME: ${E2E_USERNAME}
      PASSWORD: ${E2E_PASSWORD}
- runFlow: subflows/open-security.yaml

# The ChangeCredential row's own tap target is targeted by id, not by the "Password" label or
# "Edit" link text: every profile field row (and the credential row) renders an identical "Edit"
# link, so text would be ambiguous between them.
- runFlow: subflows/open-change-password.yaml
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_PASSWORD}
      NEW_PASSWORD: ${E2E_TEMP_PASSWORD}

# Replacing a password the user holds ends the user's sessions and revokes their tokens, so sign
# out and sign in again with the new password before changing it back. That leaves the E2E user's
# credential unchanged once this flow finishes, matching signin.yaml's "leaves the app as it found
# it" convention.
- runFlow: subflows/back-out-and-sign-out.yaml
- runFlow:
    file: subflows/sign-in-with.yaml
    env:
      USERNAME: ${E2E_USERNAME}
      PASSWORD: ${E2E_TEMP_PASSWORD}
- runFlow: subflows/open-security.yaml
- runFlow: subflows/open-change-password.yaml
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_TEMP_PASSWORD}
      NEW_PASSWORD: ${E2E_PASSWORD}

- runFlow: subflows/back-out-and-sign-out.yaml
