# Entrypoint workflow for releasing the Flutter SDK.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"

jobs:
  validate:
    name: ✅ Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

  release:
    name: 🤖 Release flutter
    needs: [validate]
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          fetch-depth: 0

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (analyze fails on the infos) and
          # requires Gradle 9.3.1 for Android builds. Unpin once the SDK and samples are migrated.
          flutter-version: 3.47.9
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Run Flutter Analyze
        run: flutter analyze

      - name: 🧪 Run Tests
        run: flutter test

      - name: 🏷️ Bump Version
        id: bump
        run: |
          current=$(grep -m1 '^version: ' pubspec.yaml | sed -E 's/version: (.*)/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ github.event.inputs.bump_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          sed -i "s/^version: $current/version: $new_version/" pubspec.yaml
          sed -i "s/s.version          = '.*'/s.version          = '$new_version'/" ios/thunderid_flutter.podspec
          sed -i "s/^version '.*'/version '$new_version'/" android/build.gradle
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      # The CHANGELOG entry is GitHub's generated release notes for the new version: the pull
      # requests merged since the latest release, grouped by their `Type/*` label as configured in
      # .github/release.yml (pr-label-check.yml makes every pull request carry one). The GitHub
      # release below uses the same notes.
      - name: 📝 Update CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          # The previous release, set explicitly: left out, GitHub guesses it and can skip one.
          args=(-f "tag_name=v${VERSION}" -f "target_commitish=${RELEASE_REF}")
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$previous" ]; then args+=(-f "previous_tag_name=${previous}"); fi
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body)
          # The GitHub release uses the notes as they are.
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "## ${VERSION}"
            echo
            # Keep the sections and the compare link; drop the generator comment, the top-level
            # "What's Changed" heading and the "New Contributors" section.
            awk '
              /^<!--/ { next }
              /^## What.s Changed/ { next }
              /^## New Contributors/ { skip = 1; next }
              /^\*\*Full Changelog\*\*/ { skip = 0 }
              !skip
            ' <<< "$notes" | sed -e '/./,$!d'
            echo
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: 📤 Commit, Tag & Push
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          git add pubspec.yaml ios/thunderid_flutter.podspec android/build.gradle CHANGELOG.md
          git diff --cached --quiet || git commit -m "[Release] flutter v${{ steps.bump.outputs.version }}"
          for i in $(seq 1 5); do
            git pull --rebase --autostash origin "$RELEASE_REF"
            git push origin HEAD:"$RELEASE_REF" && break
            [ "$i" -eq 5 ] && exit 1
            sleep $((i * 3))
          done
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "ThunderID Flutter SDK v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
