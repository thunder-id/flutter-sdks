appId: dev.thunderid.Quickstart
name: Change password from the profile screen
tags:
  - account
env:
  E2E_USERNAME: e2e_mobile_user
  E2E_PASSWORD: TestPassword@123
  # This flow actually changes E2E_PASSWORD on the shared E2E user via the real backend (the
  # self-service credential write path has no "current value" concept to gate this behind), so it
  # changes to this value and back to E2E_PASSWORD before finishing. If this flow fails between
  # those two steps, the E2E user is left on this password until the next run fixes it, not
  # E2E_PASSWORD - see the closing comment for how a re-run recovers on its own.
  E2E_TEMP_PASSWORD: TempPassword@456
---
- launchApp:
    clearState: true
- runFlow: subflows/ensure-signed-out.yaml

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: "Sign in"
          commands:
            - launchApp:
                clearState: true
            - runFlow: subflows/ensure-signed-out.yaml
      - tapOn: "Sign in"
      - extendedWaitUntil:
          visible:
            id: "thunderid-field-username"
          timeout: 25000

- waitForAnimationToEnd:
    timeout: 3000

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: "thunderid-field-username"
          commands:
            - launchApp:
                clearState: true
            - runFlow: subflows/ensure-signed-out.yaml
            - tapOn: "Sign in"
            - extendedWaitUntil:
                visible:
                  id: "thunderid-field-username"
                timeout: 25000
            - waitForAnimationToEnd:
                timeout: 3000

      - tapOn:
          id: "thunderid-field-username"
      - eraseText: 50
      - inputText: ${E2E_USERNAME}
      - extendedWaitUntil:
          visible:
            id: "thunderid-field-password"
          timeout: 20000
      - tapOn:
          id: "thunderid-field-password"
      - eraseText: 50
      - inputText: ${E2E_PASSWORD}
      - tapOn:
          id: "thunderid-action-action_001"
      - runFlow: subflows/dismiss-save-password.yaml
      - extendedWaitUntil:
          notVisible:
            id: "thunderid-field-username"
          timeout: 20000
      - assertNotVisible: ".*NETWORK_ERROR.*"

- extendedWaitUntil:
    visible: "Session active"
    timeout: 60000

- tapOn: "Manage Account"
- extendedWaitUntil:
    visible: "Security"
    timeout: 20000
- tapOn: "Security"

# The ChangeCredential row's own tap target is targeted by id, not by the "Password" label or
# "Edit" link text: every profile field row (and the credential row) renders an identical "Edit"
# link, so text would be ambiguous between them.
- runFlow: subflows/open-change-password.yaml

# Change away from E2E_PASSWORD, then immediately back, so the E2E user's credential is unchanged
# once this flow finishes, matching signin.yaml's "leaves the app as it found it" convention.
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      NEW_PASSWORD: ${E2E_TEMP_PASSWORD}
- runFlow: subflows/open-change-password.yaml
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      NEW_PASSWORD: ${E2E_PASSWORD}

# Back out through the section screen, then the manage account hub, to the home tab. Both back
# controls are chevron-only (no label), so they're targeted by id rather than text - see
# _BackChevron in the sample for why one shared id is unambiguous here.
- tapOn:
    id: "thunderid-nav-back"
- tapOn:
    id: "thunderid-nav-back"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
