appId: dev.thunderid.Quickstart
---
# Opens the full-screen ChangeCredential form from the Security section's password row.
#
# Right after a previous change, the form is still popping back to this screen. A tap that lands
# while that transition is settling can find the row on screen yet open nothing, which on a loaded
# CI runner has left the flow waiting on a form that never appears. So wait for the screen to
# settle, then tap again until the form is actually showing.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: "thunderid-field-newCredential"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "thunderid-action-openCredential-password"
                timeout: 20000
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: "thunderid-action-openCredential-password"
      - extendedWaitUntil:
          visible:
            id: "thunderid-field-newCredential"
          timeout: 15000
