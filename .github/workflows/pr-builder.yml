# This workflow will build the project on pull requests with tests
# Uses:
#   OS: ubuntu-latest
#   Flutter: stable channel
#   Build: Flutter/Dart

name: 👷🛠️ PR Builder

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Avoid running multiple PR builders for the same PR on subsequent pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: "ThunderID"

jobs:
  dependency-review:
    name: 🔎 Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🔎 Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later
          comment-summary-in-pr: always
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  lint:
    name: 🧹 Lint Code
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (analyze fails on the infos) and
          # requires Gradle 9.3.1 for Android builds. Unpin once the SDK and samples are migrated.
          flutter-version: 3.47.9
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Run Flutter Analyze
        run: flutter analyze

  build:
    name: 🛠️ Build SDK
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (analyze fails on the infos) and
          # requires Gradle 9.3.1 for Android builds. Unpin once the SDK and samples are migrated.
          flutter-version: 3.47.9
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build SDK
        run: flutter pub get --dry-run

  test:
    name: 🧪 Run Tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (analyze fails on the infos) and
          # requires Gradle 9.3.1 for Android builds. Unpin once the SDK and samples are migrated.
          flutter-version: 3.47.9
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🧪 Run Tests
        run: flutter test

  build-sample:
    name: 🛠️ Build Quickstart Sample
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Hosted runners now default to JDK 25, which Gradle 8.14 cannot run on.
      - name: ☕ Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (analyze fails on the infos) and
          # requires Gradle 9.3.1 for Android builds. Unpin once the SDK and samples are migrated.
          flutter-version: 3.47.9
          cache: true

      # The sample lives in thunder-id/samples; this fetches it and points it at this checkout.
      - name: 📥 Fetch Quickstart Sample
        run: tests/e2e/scripts/prepare-sample.sh

      - name: 📦 Get Dependencies
        working-directory: tests/e2e/.samples/quickstarts/flutter
        run: flutter pub get

      - name: 🔐 Create Sample .env
        working-directory: tests/e2e/.samples/quickstarts/flutter
        run: cp .env.example .env

      - name: 🔍 Analyze Quickstart Sample
        working-directory: tests/e2e/.samples/quickstarts/flutter
        run: flutter analyze

      - name: 🔨 Build Quickstart Sample
        working-directory: tests/e2e/.samples/quickstarts/flutter
        run: flutter build apk --debug

  build-playground:
    name: 🛝 Build Playground
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Hosted runners now default to JDK 25, which Gradle 8.14 cannot run on.
      - name: ☕ Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (analyze fails on the infos) and
          # requires Gradle 9.3.1 for Android builds. Unpin once the SDK and samples are migrated.
          flutter-version: 3.47.9
          cache: true

      # The playground depends on this checkout (thunderid_flutter: path: ..).
      - name: 🔐 Create Playground .env
        working-directory: playground
        run: cp .env.example .env

      - name: 📦 Get Dependencies
        working-directory: playground
        run: flutter pub get

      - name: 🔍 Analyze Playground
        working-directory: playground
        run: flutter analyze

      - name: 🔨 Build Playground
        working-directory: playground
        run: flutter build apk --debug

  e2e:
    name: 🎭 E2E Tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/run-e2e-suite.yml
    with:
      # Fork PRs run without repository secrets, so the unauthenticated GitHub API call that
      # resolves "latest" hits its rate limit easily. The nightly workflow already exists to
      # catch breakage from new server releases, so pin the PR builder to a known-good
      # version instead of resolving it live; bump this alongside the server's own releases.
      thunderid-version: "1.0.1"
